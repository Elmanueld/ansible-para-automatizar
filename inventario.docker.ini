[servidores]
servidor1 ansible_host=servidor1 ansible_port=22
servidor2 ansible_host=servidor2 ansible_port=22
servidor3 ansible_host=servidor3 ansible_port=22
servidor4 ansible_host=servidor4 ansible_port=22
servidor5 ansible_host=servidor5 ansible_port=22

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_connection=ssh
ansible_become=true
ansible_become_method=sudo
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

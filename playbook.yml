---
- name: Preparar los cinco servidores Ubuntu
  hosts: servidores
  become: true
  gather_facts: false

  tasks:
    - name: Actualizar la cache de APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: true
        shell: /bin/bash

    - name: Crear el directorio app
      ansible.builtin.file:
        path: /home/ansible/app
        state: directory
        owner: ansible
        group: ansible
        mode: "0755"

    - name: Crear hola.txt dentro de app
      ansible.builtin.copy:
        dest: /home/ansible/app/hola.txt
        content: "Hola desde Ansible en {{ inventory_hostname }}\n"
        owner: ansible
        group: ansible
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
